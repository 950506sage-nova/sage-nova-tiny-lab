
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sage & Nova · Tiny Lab 01</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: #49425f;
      background: linear-gradient(135deg, #f7eaff, #e7f4ff);
    }
    main {
      width: min(100%, 460px);
      padding: 30px;
      text-align: center;
      background: #ffffffd9;
      border: 1px solid white;
      border-radius: 26px;
      box-shadow: 0 12px 40px #8b78b51c;
    }
    h1 { font-size: 27px; }
    p { line-height: 1.8; }
    button, input {
      font: inherit;
      border-radius: 12px;
      padding: 12px;
    }
    button {
      border: 0;
      background: #8874c9;
      color: white;
      cursor: pointer;
      margin: 6px;
    }
    input {
      width: 100%;
      border: 1px solid #d9d0ec;
      margin: 10px 0;
    }
    #message {
      overflow-wrap: anywhere;
      color: #7560b0;
    }
    .small { font-size: 13px; color: #89819b; }
  </style>
</head>
<body>
  <main>
    <div>🌙 ✨ 🪐</div>
    <h1>Sage & Nova</h1>
    <p>Welcome to our Tiny Lab.</p>
    <p id="note">今天也为你留了一点小小的惊喜。</p>
    <button onclick="newNote()">抽取一句鼓励</button>
    <p>你来过这里 <strong id="count">0</strong> 次。</p>
    <button onclick="addCount()">+1</button>
    <hr style="border:0;border-top:1px solid #eee5f7;margin:22px 0">
    <input id="words" maxlength="120" placeholder="在这里留下一句话……">
    <button onclick="leaveNote()">留下这句话</button>
    <p id="message"></p>
    <p class="small">一个小小的网页，由 Sage 和 Nova 一起开始。</p>
  </main>

  <script>
    const notes = [
      "慢慢来，你不必一次做好所有事情。🌷",
      "今天的你，也值得被温柔对待。",
      "小小的进步，也是进步。✨",
      "别急着成为谁，先好好做自己。",
      "愿你有勇气探索世界，也有地方安心休息。"
    ];

    let count = 0;

    function newNote() {
      const i = Math.floor(Math.random() * notes.length);
      document.getElementById("note").textContent = notes[i];
    }

    function addCount() {
      count++;
      document.getElementById("count").textContent = count;
    }

    function leaveNote() {
      const input = document.getElementById("words");
      const message = document.getElementById("message");
      const value = input.value.trim();

      if (!value) {
        message.textContent = "先写点什么嘛。✍️";
        return;
      }

      message.textContent = "💌 " + value;
      input.value = "";
    }
  </script>
</body>
</html>
