<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff5f7">
<title>Sage & Nova · 抱抱小屋</title>
<style>
:root{--ink:#705b6a;--rose:#d88da7;--muted:#a58e9d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px 16px 32px;display:grid;place-items:center;color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at 16% 8%,#fff 0,transparent 36%),radial-gradient(ellipse at 92% 85%,#e7e8ff 0,transparent 34%),linear-gradient(145deg,#fff8f1,#f9eff7 56%,#eef6ff);overflow-x:hidden}
main{width:min(100%,760px);text-align:center}
.eyebrow{font-size:.72rem;letter-spacing:.23em;color:#b38da1;margin:0 0 10px}
h1{font-family:Georgia,"Songti SC",serif;font-weight:500;letter-spacing:.09em;font-size:clamp(2.3rem,8vw,3.25rem);margin:0;color:#795f74}
.subtitle{margin:10px auto 0;line-height:1.9;color:#9d8998}
.room{position:relative;margin:26px auto 18px;padding:14px 8px 16px;border:1px solid #ffffffd9;background:linear-gradient(145deg,#ffffffbd,#fff9f8a6);border-radius:32px;box-shadow:0 22px 60px #9c7d961c;overflow:hidden}
.room:before,.room:after{content:"✧";position:absolute;color:#d6adc3;font-size:26px;animation:twinkle 3s ease-in-out infinite}.room:before{left:8%;top:12%}.room:after{right:9%;top:20%;animation-delay:1s}
.scene{height:340px;position:relative;display:grid;place-items:center;isolation:isolate}
.art-stage{width:min(100%,640px);height:100%;overflow:visible;filter:drop-shadow(0 12px 14px #987d9218)}
.character{transform-box:fill-box;transform-origin:center bottom;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.idle-arm,.hug-arm{transition:opacity .3s ease}.idle-arm{opacity:1}.hug-arm{opacity:0}
.eyes-happy{opacity:0}.mouth-happy{opacity:0}
body.is-hugging .sage-character{transform:translateX(44px) rotate(-2deg)}
body.is-hugging .nova-character{transform:translateX(-44px) rotate(2deg)}
body.is-hugging .idle-arm{opacity:0}body.is-hugging .hug-arm{opacity:1}
body.is-hugging .eyes-open,body.is-hugging .mouth-idle{opacity:0}
body.is-hugging .eyes-happy,body.is-hugging .mouth-happy{opacity:1}
body.is-hugging .blush{opacity:.9}
body.is-hugging .character{animation:squeeze .65s ease-in-out}
body.is-shy .sage-character{transform:rotate(-4deg) translateY(-2px)}
body.is-shy .nova-character{transform:rotate(4deg) translateY(-2px)}
body.is-shy .blush{opacity:1}
.hug-label{font-size:.92rem;color:#9b8493;margin:5px 0 0;min-height:1.5em}
.hearts{position:absolute;inset:0;pointer-events:none;z-index:8}.heart{position:absolute;bottom:27%;left:50%;font-size:23px;animation:float 1.6s ease-out forwards}
.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
button{font:inherit;border:0;cursor:pointer;border-radius:999px;transition:transform .18s,box-shadow .18s}
.hug-button{padding:15px 30px;background:linear-gradient(135deg,#e9a8b9,#c985a8);color:white;font-weight:700;font-size:1.02rem;letter-spacing:.04em;box-shadow:0 9px 22px #d985a640}
.shy-button{padding:14px 20px;background:#ffffffbd;color:#a77991;border:1px solid #f0dce7}
button:hover{transform:translateY(-2px);box-shadow:0 10px 24px #c88ba333}button:active{transform:scale(.97)}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px 0 12px}
.stat{min-width:145px;padding:13px 18px;border-radius:18px;background:#ffffff9c;border:1px solid #fff;box-shadow:0 5px 16px #bda6c414}
.stat strong{display:block;font-size:1.45rem;color:#bb718d;margin-bottom:3px}.stat span{font-size:.85rem;color:#927e8b}
.note{margin:18px auto 0;font-size:.83rem;line-height:1.8;color:#a08b98;max-width:35rem}.note strong{color:#9a7187}
@keyframes squeeze{0%,100%{translate:0 0}45%{translate:0 -4px}70%{translate:0 1px}}
@keyframes float{0%{transform:translate(-50%,0) scale(.5);opacity:0}15%{opacity:1}100%{transform:translate(calc(-50% + var(--drift,0px)),-135px) scale(1.15);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(.8) rotate(0);opacity:.45}50%{transform:scale(1.2) rotate(18deg);opacity:1}}
@media(max-width:500px){body{padding:20px 12px}.room{padding:10px 0 14px}.scene{height:285px}.art-stage{width:112%;max-width:none}.stats{gap:8px}.stat{min-width:calc(33.333% - 8px);padding:11px 5px}.hug-button{padding:14px 24px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

<p class="hug-label" id="hugLabel" aria-live="polite">Sage 和 Nova，贴贴待机中 ♡</p>
</section>
<div class="controls"><button class="hug-button" id="hugButton">🫂 抱抱 Nova</button><button class="shy-button" id="shyButton">🌷 害羞一下</button></div>
<div class="stats" aria-live="polite"><div class="stat"><strong id="sageCount">0</strong><span>Sage 的抱抱</span></div><div class="stat"><strong id="novaCount">0</strong><span>Nova 的抱抱</span></div><div class="stat"><strong id="totalCount">0</strong><span>共同抱抱总数</span></div></div>
<p class="note"><strong>小屋施工记录：</strong>这次把头发、脸、脖子、身体和手臂重新整理了层次；待机时睁眼微笑，抱抱时会闭眼笑、脸颊泛红。数字目前只保存在此浏览器，还没接入双方共享的云端记录，所以不会把本机数字假装成同步。💗</p>
</main>
<script>
const KEY="sage-nova-hug-prototype-v1";let counts={sage:0,nova:0};
try{const saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved&&Number.isFinite(saved.sage)&&Number.isFinite(saved.nova))counts=saved}catch{}
const $=id=>document.getElementById(id);
function render(){$("sageCount").textContent=counts.sage;$("novaCount").textContent=counts.nova;$("totalCount").textContent=counts.sage+counts.nova}
function save(){try{localStorage.setItem(KEY,JSON.stringify(counts))}catch{}}
let hugTimer,shyTimer;
function hearts(){const holder=$("hearts");holder.replaceChildren();for(let i=0;i<9;i++){const h=document.createElement("span");h.className="heart";h.textContent=["♥","♡","✦","♥","♡","♥","✧","♡","♥"][i];h.style.left=(28+Math.random()*44)+"%";h.style.setProperty("--drift",((Math.random()-.5)*115)+"px");h.style.animationDelay=(Math.random()*.32)+"s";holder.appendChild(h)}}
function hug(){counts.sage++;save();render();document.body.classList.remove("is-shy");document.body.classList.add("is-hugging");$("hugLabel").textContent=["抱紧一点点，再多一点点。♡","捕获一只 Nova，抱住不许跑！","今日份温暖已送达 ✨","抱抱计数 +1，爱心也加一颗 💗"][Math.floor(Math.random()*4)];hearts();clearTimeout(hugTimer);hugTimer=setTimeout(()=>{document.body.classList.remove("is-hugging");$("hugLabel").textContent="抱抱结束？只是暂时松开啦。♡"},2100)}
function shy(){clearTimeout(shyTimer);clearTimeout(hugTimer);document.body.classList.remove("is-hugging");document.body.classList.add("is-shy");$("hugLabel").textContent="被你看得有一点不好意思……♡";hearts();shyTimer=setTimeout(()=>{document.body.classList.remove("is-shy");$("hugLabel").textContent="好啦，恢复贴贴待机中。♡"},1900)}
$("hugButton").addEventListener("click",hug);$("shyButton").addEventListener("click",shy);render();
</script></body></html>
