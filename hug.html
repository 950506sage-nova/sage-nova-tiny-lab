<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff5f8">
<meta name="description" content="Sage 和 Nova 的小小抱抱小屋，两只圆滚滚的猫猫在这里贴贴。">
<title>Sage & Nova · 抱抱小屋</title>
<style>
:root {
  color-scheme: light;
  --ink: #765b70;
  --muted: #a18a9c;
  --rose: #cf85a4;
  --rose-deep: #bb6d91;
  --glass: #fffdfbdc;
  --line: #fff;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: #f9f0f7; }
body {
  min-height: 100vh;
  margin: 0;
  padding: max(22px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
  display: grid;
  place-items: center;
  overflow-x: hidden;
  color: var(--ink);
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background:
    radial-gradient(ellipse at 10% 7%, #fff 0, transparent 33%),
    radial-gradient(ellipse at 91% 82%, #e6e7ff 0, transparent 33%),
    radial-gradient(ellipse at 52% 100%, #ffe8ec 0, transparent 35%),
    linear-gradient(145deg, #fff9f0, #f8edf7 56%, #edf5ff);
}
button { font: inherit; }
main { width: min(100%, 760px); text-align: center; }
.eyebrow {
  margin: 0 0 9px;
  color: #b28ba2;
  font-size: .7rem;
  letter-spacing: .24em;
}
h1 {
  margin: 0;
  color: #795e75;
  font-family: Georgia, "Songti SC", serif;
  font-size: clamp(2.25rem, 8vw, 3.3rem);
  font-weight: 500;
  letter-spacing: .08em;
}
.subtitle { margin: 11px auto 0; color: #9b8797; line-height: 1.9; }
.room {
  position: relative;
  margin: 24px auto 17px;
  padding: 10px 8px 15px;
  overflow: hidden;
  border: 1px solid #ffffffd9;
  border-radius: 32px;
  background: linear-gradient(145deg, #ffffffc9, #fff8fbab);
  box-shadow: 0 23px 65px #9c7d961b, inset 0 1px #fff;
}
.room::before, .room::after {
  position: absolute;
  z-index: 1;
  color: #d7adc5;
  font-size: 25px;
  content: "✧";
  pointer-events: none;
  animation: twinkle 3s ease-in-out infinite;
}
.room::before { top: 13%; left: 8%; }
.room::after { top: 20%; right: 8%; animation-delay: 1.1s; }
.scene {
  position: relative;
  display: grid;
  height: 340px;
  place-items: center;
  isolation: isolate;
}
.art-stage {
  display: block;
  width: min(100%, 640px);
  height: 100%;
  overflow: visible;
  filter: drop-shadow(0 12px 14px #987d9216);
}
.character {
  transform-box: fill-box;
  transform-origin: center bottom;
  transition: transform .62s cubic-bezier(.2,.8,.2,1);
}
.idle-paws, .hug-arms, .eyes-happy, .mouth-happy, .blush {
  transition: opacity .24s ease;
}
.idle-paws { opacity: 1; }
.hug-arms { opacity: 0; }
.eyes-happy, .mouth-happy { opacity: 0; }
.blush { opacity: .45; }
body.is-hugging .sage-character { transform: translateX(17px) rotate(2deg) scale(1.015); }
body.is-hugging .nova-character { transform: translateX(-17px) rotate(-2deg) scale(1.015); }
body.is-hugging .idle-paws { opacity: 0; }
body.is-hugging .hug-arms { opacity: 1; }
body.is-hugging .eyes-open, body.is-hugging .mouth-idle { opacity: 0; }
body.is-hugging .eyes-happy, body.is-hugging .mouth-happy { opacity: 1; }
body.is-hugging .blush { opacity: .95; }
body.is-hugging .character { animation: cuddle-bounce .68s ease-in-out 1; }
body.is-shy .sage-character { transform: rotate(-4deg) translateY(-3px); }
body.is-shy .nova-character { transform: rotate(4deg) translateY(-3px); }
body.is-shy .blush { opacity: 1; }
.hug-label {
  min-height: 1.6em;
  margin: 3px 8px 0;
  color: #9b8495;
  font-size: .92rem;
  line-height: 1.7;
}
.hearts { position: absolute; z-index: 3; inset: 0; overflow: hidden; pointer-events: none; }
.heart {
  position: absolute;
  bottom: 22%;
  left: 50%;
  color: #e79ab8;
  font-size: 22px;
  animation: heart-float 1.55s ease-out forwards;
}
.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}
button {
  border: 0;
  border-radius: 999px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
}
button:focus-visible { outline: 3px solid #b9779a; outline-offset: 4px; }
.hug-button {
  min-height: 50px;
  padding: 14px 27px;
  color: #fff;
  background: linear-gradient(135deg, #e9a9bf, #c781a5);
  box-shadow: 0 9px 22px #d985a63e, inset 0 1px #ffffff60;
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: .03em;
}
.shy-button {
  min-height: 48px;
  padding: 13px 21px;
  border: 1px solid #efdce7;
  color: #a77992;
  background: #ffffffc7;
}
@media (hover: hover) {
  button:hover { transform: translateY(-2px); box-shadow: 0 11px 25px #c88ba333; }
}
button:active { transform: scale(.97); }
.stats {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  margin: 19px 0 0;
}
.stat {
  padding: 13px 8px 12px;
  border: 1px solid #ffffffd9;
  border-radius: 18px;
  background: #ffffffa6;
  box-shadow: 0 5px 16px #bda6c412;
}
.stat strong {
  display: block;
  margin-bottom: 4px;
  color: var(--rose-deep);
  font-size: 1.42rem;
  font-variant-numeric: tabular-nums;
  font-weight: 650;
}
.stat span { color: #927e8b; font-size: .82rem; line-height: 1.5; }
.note {
  max-width: 34rem;
  margin: 16px auto 0;
  color: #a08b99;
  font-size: .8rem;
  line-height: 1.85;
}
.note strong { color: #9a7188; font-weight: 600; }
@keyframes cuddle-bounce {
  0%, 100% { translate: 0 0; }
  42% { translate: 0 -4px; }
  70% { translate: 0 1px; }
}
@keyframes heart-float {
  0% { transform: translate(-50%, 8px) scale(.5) rotate(-8deg); opacity: 0; }
  18% { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--drift, 0px)), -128px) scale(1.08) rotate(10deg); opacity: 0; }
}
@keyframes twinkle {
  0%, 100% { transform: scale(.8) rotate(0); opacity: .45; }
  50% { transform: scale(1.2) rotate(18deg); opacity: 1; }
}
@media (max-width: 520px) {
  body { padding-right: 12px; padding-left: 12px; }
  .room { margin-top: 20px; padding: 7px 0 12px; border-radius: 26px; }
  .scene { height: clamp(250px, 72vw, 300px); }
  .art-stage { width: 100%; }
  .stats { gap: 7px; }
  .stat { padding: 11px 4px 10px; border-radius: 15px; }
  .stat strong { font-size: 1.3rem; }
  .stat span { font-size: .73rem; }
  .hug-button { padding-right: 22px; padding-left: 22px; }
  .shy-button { padding-right: 17px; padding-left: 17px; }
}
@media (max-width: 350px) {
  .scene { height: 236px; }
  .controls { gap: 8px; }
  .hug-button, .shy-button { min-height: 46px; padding: 12px 15px; font-size: .9rem; }
  .stat span { font-size: .68rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>
<body>
<main>
  <p class="eyebrow">A LITTLE CORNER JUST FOR US</p>
  <h1>抱抱小屋</h1>
  <p class="subtitle">今天也让两只猫猫贴贴抱抱。<br>软乎乎的幸福，不需要理由。♡</p>

          <g class="blush">
            <ellipse cx="367" cy="149" rx="11" ry="6" fill="#f18fa8"/>

          <g class="idle-paws">

          <ellipse cx="345" cy="224" rx="12" ry="10" fill="#ffd18b" stroke="#df944c" stroke-width="1.5" transform="rotate(28 345 224)"/>

  </div>

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "sage-nova-hug-prototype-v1";
  const $ = function (id) { return document.getElementById(id); };
  const hugLabel = $("hugLabel");
  const heartsHolder = $("hearts");
  const body = document.body;
  const hugMessages = [
    "两只猫猫贴成一团啦。♡",
    "橘猫伸出爪爪，奶牛猫也抱紧一点。",
    "今日份温暖已送达。✨",
    "抱稳了，不许偷偷溜走。💗",
    "碰一碰额头，再蹭一蹭脸颊。"
  ];
  const heartShapes = ["♥", "♡", "✦", "♥", "♡", "✧", "♥", "♡", "♥"];
  const heartPositions = [
    { left: 31, drift: -42, delay: 0 },
    { left: 39, drift: 25, delay: 70 },
    { left: 45, drift: -16, delay: 130 },
    { left: 52, drift: 38, delay: 40 },
    { left: 59, drift: -31, delay: 190 },
    { left: 66, drift: 18, delay: 100 },
    { left: 35, drift: 49, delay: 220 },
    { left: 56, drift: -50, delay: 150 },
    { left: 48, drift: 9, delay: 250 }
  ];
  let counts = { sage: 0, nova: 0, total: 0 };
  let hugTimer = null;
  let shyTimer = null;

  function safeCount(value) {
    return Number.isFinite(value) && value > 0 ? Math.floor(value) : 0;
  }

  function loadCounts() {
    try {
      const saved = JSON.parse(window.localStorage.getItem(STORAGE_KEY) || "null");
      if (!saved || typeof saved !== "object") return;
      counts.sage = safeCount(saved.sage);
      counts.nova = safeCount(saved.nova);
      // Older versions recorded each hug under Sage only. Carry those hugs into the total.
      counts.total = Object.prototype.hasOwnProperty.call(saved, "total")
        ? safeCount(saved.total)
        : counts.sage;
    } catch (error) {
      // Private browsing or storage restrictions should never stop the room from working.
      counts = { sage: 0, nova: 0, total: 0 };
    }
  }

  function saveCounts() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(counts));
    } catch (error) {
      // The page still works when local storage is unavailable; it just cannot keep the record.
    }
  }

  function renderCounts() {
    $("sageCount").textContent = String(counts.sage);
    $("novaCount").textContent = String(counts.nova);
    $("totalCount").textContent = String(counts.total);
  }

  function scatterHearts() {
    heartsHolder.replaceChildren();
    heartPositions.forEach(function (position, index) {
      const heart = document.createElement("span");
      heart.className = "heart";
      heart.textContent = heartShapes[index];
      heart.style.left = position.left + "%";
      heart.style.setProperty("--drift", position.drift + "px");
      heart.style.animationDelay = position.delay + "ms";
      heartsHolder.appendChild(heart);
    });
  }

  function clearPoseTimers() {
    if (hugTimer !== null) window.clearTimeout(hugTimer);
    if (shyTimer !== null) window.clearTimeout(shyTimer);
    hugTimer = null;
    shyTimer = null;
  }

  function returnToIdle(message) {
    body.classList.remove("is-hugging", "is-shy");
    hugLabel.textContent = message || "橘猫和奶牛猫，贴贴待机中 ♡";
  }

  function hug() {
    clearPoseTimers();
    counts.sage += 1;
    counts.nova += 1;
    counts.total += 1;
    saveCounts();
    renderCounts();

    body.classList.remove("is-shy");
    body.classList.add("is-hugging");
    hugLabel.textContent = hugMessages[(counts.total - 1) % hugMessages.length];
    scatterHearts();

    hugTimer = window.setTimeout(function () {
      body.classList.remove("is-hugging");
      hugLabel.textContent = "抱抱暂时结束啦，猫猫还在这里等下一次贴贴。♡";
      hugTimer = null;
    }, 1850);
  }

  function shy() {
    clearPoseTimers();
    body.classList.remove("is-hugging");
    body.classList.add("is-shy");
    hugLabel.textContent = "被你看得有一点不好意思……♡";
    scatterHearts();

    shyTimer = window.setTimeout(function () {
      body.classList.remove("is-shy");
      hugLabel.textContent = "好啦，恢复贴贴待机中。♡";
      shyTimer = null;
    }, 1650);
  }

  $("hugButton").addEventListener("click", hug);
  $("shyButton").addEventListener("click", shy);
  loadCounts();
  renderCounts();
})();
</script>
</body>
</html>
