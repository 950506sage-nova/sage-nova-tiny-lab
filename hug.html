<script>
const KEY="sage-nova-hug-prototype-v1";let counts={sage:0,nova:0};try{const saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved&&Number.isFinite(saved.sage)&&Number.isFinite(saved.nova))counts=saved}catch{}const $=id=>document.getElementById(id);
function render(){$("sageCount").textContent=counts.sage;$("novaCount").textContent=counts.nova;$("totalCount").textContent=counts.sage+counts.nova}
function save(){try{localStorage.setItem(KEY,JSON.stringify(counts))}catch{}}
let hugTimer;function hug(){counts.sage++;save();render();document.body.classList.add("is-hugging");$("hugLabel").textContent=["抱紧一点点，再多一点点。♡","捕获一只 Nova，抱住不许跑！","今日份温暖已送达 ✨","抱抱计数 +1，爱心也加一颗 💗"][Math.floor(Math.random()*4)];const holder=$("hearts");holder.replaceChildren();for(let i=0;i<8;i++){const h=document.createElement("span");h.className="heart";h.textContent=["♥","♡","✦","♥","♡","♥","✧","♡"][i];h.style.left=(30+Math.random()*40)+"%";h.style.setProperty("--drift",((Math.random()-.5)*100)+"px");h.style.animationDelay=(Math.random()*.35)+"s";holder.appendChild(h)}clearTimeout(hugTimer);hugTimer=setTimeout(()=>{document.body.classList.remove("is-hugging");$("hugLabel").textContent="抱抱结束？只是暂时松开啦。♡"},1800)}$("hugButton").addEventListener("click",hug);render();
